<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GreenLeaf Garden | Volunteer</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <header>
    <h1>Volunteer with GreenLeaf Garden</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html" class="active">Volunteer</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>Join Our Volunteer Team</h2>
      <form id="volunteerForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" required>

        <label for="role">Volunteer Interest:</label>
        <select id="role" required>
          <option value="">Select...</option>
          <option>Gardening</option>
          <option>Community Outreach</option>
          <option>Event Planning</option>
        </select>

        <div class="consent">
          <label><input type="checkbox" id="newsletter"> Subscribe to our newsletter</label><br>
          <label><input type="checkbox" id="agree" required> I agree to the terms & privacy policy</label>
        </div>

        <button type="submit">Submit</button>
      </form>

      <div id="confirmation" class="hidden">
        <p> Thank you for joining GreenLeaf Garden! We’ll reach out to you soon.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 GreenLeaf Garden | Growing Together </p>
  </footer>

  <script>
    $(document).ready(function() {
      $("#volunteerForm").submit(function(e) {
        e.preventDefault();
        if (!$("#agree").is(":checked")) {
          alert("Please agree to the terms before submitting.");
          return;
        }
        $(this).hide();
        $("#confirmation").fadeIn();
      });
    });
  </script>
</body>
</html>
